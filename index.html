<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tax & ITR Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
        }

        p {
            color: #555;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: #111827;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        button:disabled {
            opacity: 0.6;
        }

        #result {
            margin-top: 25px;
            padding: 15px;
            background: #f1f5f9;
            border-radius: 8px;
            display: none;
            line-height: 1.6;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>AI Tax & ITR Assistant</h1>

    <p>
        Enter your basic information to get an AI-generated
        ITR preparation assessment.
    </p>

    <label>Your Name</label>
    <input type="text" id="name" placeholder="Enter your name">

    <label>Income Type</label>
    <select id="incomeType">
        <option value="">Select</option>
        <option>Salary</option>
        <option>Business</option>
        <option>Profession</option>
        <option>Other</option>
    </select>

    <label>Annual Income</label>
    <input type="number" id="income" placeholder="Example: 800000">

    <label>Home Loan</label>
    <select id="homeLoan">
        <option>No</option>
        <option>Yes</option>
    </select>

    <label>Health Insurance</label>
    <select id="insurance">
        <option>No</option>
        <option>Yes</option>
    </select>

    <label>Investments</label>
    <select id="investment">
        <option>No</option>
        <option>Yes</option>
    </select>

    <label>Other Income</label>
    <input type="number" id="otherIncome" placeholder="Example: 50000">

    <button id="generateBtn" onclick="generateAssessment()">
        Generate AI Assessment
    </button>

    <div id="result"></div>

</div>

<script>

async function generateAssessment() {

    const name = document.getElementById("name").value;
    const incomeType = document.getElementById("incomeType").value;
    const income = document.getElementById("income").value;
    const homeLoan = document.getElementById("homeLoan").value;
    const insurance = document.getElementById("insurance").value;
    const investment = document.getElementById("investment").value;
    const otherIncome = document.getElementById("otherIncome").value;

    if (!name || !incomeType || !income) {
        alert("Please fill Name, Income Type and Annual Income.");
        return;
    }

    const button = document.getElementById("generateBtn");
    const result = document.getElementById("result");

    button.disabled = true;
    button.innerText = "Generating AI Assessment...";

    result.style.display = "block";
    result.innerHTML = "⏳ Please wait... AI is analyzing your information.";

    const message = `
You are an Indian tax and ITR preparation assistant.

The user has provided the following information:

Name: ${name}
Income Type: ${incomeType}
Annual Income: ₹${income}
Home Loan: ${homeLoan}
Health Insurance: ${insurance}
Investments: ${investment}
Other Income: ₹${otherIncome || 0}

Provide a simple preliminary assessment.

Include:
1. Information summary
2. Documents that may be required
3. Additional information needed
4. General tax-related considerations
5. Recommended next steps

Do not invent facts.
Do not claim to be a Chartered Accountant.
Do not present the response as final tax advice.
If information is missing, clearly mention it.
Use simple language.
`;

    try {

        const response = await fetch("/api/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: message
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Something went wrong");
        }

        result.innerHTML = `
            <h3>🤖 AI Assessment</h3>
            <div>${formatResponse(data.answer)}</div>
        `;

    } catch (error) {

        result.innerHTML = `
            <h3>❌ Error</h3>
            <p>${error.message}</p>
        `;

    } finally {

        button.disabled = false;
        button.innerText = "Generate AI Assessment";

    }
}


function formatResponse(text) {

    return text
        .replace(/\n/g, "<br>")
        .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");

}

</script>

</body>
</html>
